<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#fff4d6" />
  <title>Burger Hop</title>
  <style>
    :root{
      --cream:#fff4d6;
      --brown:#5a341d;
      --red:#e84f35;
      --yellow:#f6c945;
      --mint:#bfe8cf;
      --road:#4b4b55;
      --grass:#9ed36a;
      --white:#fff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--brown);overflow-x:hidden}
    body{display:flex;justify-content:center;padding:18px}
    .wrap{width:min(980px,100%)}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
    .title{display:flex;align-items:center;gap:12px}
    .logo{font-size:42px}
    h1{margin:0;font-size:clamp(2rem,5vw,3.5rem);line-height:.95;letter-spacing:-.05em}
    .sub{margin:5px 0 0;color:#7a5a43;font-weight:650}
    .hud{display:flex;gap:8px;flex-wrap:wrap}
    .pill{background:#fff;border:2px solid #eadab6;border-radius:999px;padding:9px 13px;font-weight:850;box-shadow:0 4px 0 #eadab6}
    .game-shell{background:#fff;border:3px solid #eadab6;border-radius:24px;padding:12px;box-shadow:0 16px 40px rgba(90,52,29,.14)}
    canvas{display:block;width:100%;aspect-ratio:4/5;max-height:72vh;border-radius:16px;background:#bfe8cf;touch-action:none}
    .controls{display:grid;grid-template-columns:70px 70px 70px;grid-template-areas:". up ." "left down right";justify-content:center;gap:8px;margin:14px auto 2px;user-select:none}
    .ctrl{height:56px;border:none;border-radius:16px;background:#fff4d6;color:#5a341d;font-size:26px;font-weight:900;box-shadow:0 5px 0 #e4c58d;touch-action:manipulation}
    .ctrl:active{transform:translateY(3px);box-shadow:0 2px 0 #e4c58d}
    .up{grid-area:up}.left{grid-area:left}.down{grid-area:down}.right{grid-area:right}
    .bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
    .btn{border:none;border-radius:14px;padding:11px 16px;background:var(--red);color:#fff;font-weight:900;box-shadow:0 5px 0 #b73525}
    .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b73525}
    .hint{font-size:.9rem;color:#7a5a43;font-weight:650}
    @media (min-width:760px){canvas{aspect-ratio:16/10}.controls{display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <div class="logo">🐸🍔</div>
        <div>
          <h1>Burger Hop</h1>
          <p class="sub">Cross the burger lanes. Grab the ice cream.</p>
        </div>
      </div>
      <div class="hud">
        <div class="pill">Score <span id="score">0</span></div>
        <div class="pill">Lives <span id="lives">3</span></div>
        <div class="pill">Level <span id="level">1</span></div>
      </div>
    </header>

    <div class="game-shell">
      <canvas id="game" width="800" height="1000" aria-label="Burger Hop game"></canvas>
      <div class="controls" aria-label="Mobile controls">
        <button class="ctrl up" data-dir="up">▲</button>
        <button class="ctrl left" data-dir="left">◀</button>
        <button class="ctrl down" data-dir="down">▼</button>
        <button class="ctrl right" data-dir="right">▶</button>
      </div>
      <div class="bar">
        <div class="hint">Desktop: arrow keys / WASD · Mobile: tap arrows</div>
        <button class="btn" id="restart">Restart</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');

    const cols = 10;
    const rows = 12;
    let cellW, cellH;
    let score = 0;
    let lives = 3;
    let level = 1;
    let running = true;
    let lastTime = 0;

    const frog = {x:4,y:11};
    let hazards = [];
    const laneRows = [3,4,5,7,8,9];
    const laneDirs = [1,-1,1,-1,1,-1];

    function resize(){
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      cellW = rect.width / cols;
      cellH = rect.height / rows;
    }

    function resetFrog(){ frog.x = 4; frog.y = 11; }

    function makeHazards(){
      hazards = [];
      laneRows.forEach((row,i)=>{
        const count = 3 + (i%2);
        for(let j=0;j<count;j++){
          hazards.push({
            row,
            x:(j * (cols/count)) + Math.random()*1.2,
            speed:(0.75 + i*0.12 + level*0.08) * laneDirs[i],
            type:(i+j)%2===0?'burger':'fries'
          });
        }
      });
    }

    function restart(){
      score=0;lives=3;level=1;running=true;resetFrog();makeHazards();updateHud();
    }

    function updateHud(){
      scoreEl.textContent=score;
      livesEl.textContent=lives;
      levelEl.textContent=level;
    }

    function move(dx,dy){
      if(!running) return;
      frog.x = Math.max(0, Math.min(cols-1, frog.x+dx));
      frog.y = Math.max(0, Math.min(rows-1, frog.y+dy));
      if(dy < 0) score += 10;
      if(frog.y===0){
        score += 250;
        level++;
        resetFrog();
        makeHazards();
        updateHud();
      }
    }

    function hit(){
      lives--;
      updateHud();
      resetFrog();
      if(lives<=0) running=false;
    }

    function update(dt){
      if(!running) return;
      hazards.forEach(h=>{
        h.x += h.speed*dt;
        if(h.speed>0 && h.x>cols+1) h.x=-1.5;
        if(h.speed<0 && h.x<-1.5) h.x=cols+1;
      });

      const frogCx=frog.x+0.5;
      for(const h of hazards){
        if(h.row===frog.y && Math.abs((h.x+0.55)-frogCx)<0.6){ hit(); break; }
      }
    }

    function roundedRect(x,y,w,h,r,fill){
      ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
    }

    function drawLane(row){
      const y=row*cellH;
      ctx.fillStyle='#4b4b55';ctx.fillRect(0,y,canvas.getBoundingClientRect().width,cellH);
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.setLineDash([18,18]);
      ctx.beginPath();ctx.moveTo(0,y+cellH/2);ctx.lineTo(canvas.getBoundingClientRect().width,y+cellH/2);ctx.stroke();ctx.setLineDash([]);
    }

    function drawBurger(x,row,type){
      const px=x*cellW, py=row*cellH;
      const s=Math.min(cellW,cellH)*0.72;
      const cx=px+cellW/2, cy=py+cellH/2;
      ctx.font=`${s}px Apple Color Emoji, Segoe UI Emoji, sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(type==='burger'?'🍔':'🍟',cx,cy);
    }

    function drawFrog(){
      const cx=(frog.x+.5)*cellW,cy=(frog.y+.5)*cellH;
      const s=Math.min(cellW,cellH)*0.78;
      ctx.font=`${s}px Apple Color Emoji, Segoe UI Emoji, sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐸',cx,cy);
    }

    function drawGoal(){
      const rect=canvas.getBoundingClientRect();
      ctx.fillStyle='#f8d9e8';ctx.fillRect(0,0,rect.width,cellH);
      ctx.font=`${Math.min(cellW,cellH)*0.65}px Apple Color Emoji, Segoe UI Emoji, sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      for(let i=1;i<cols;i+=2) ctx.fillText('🍦',(i+.5)*cellW,cellH/2);
    }

    function draw(){
      const rect=canvas.getBoundingClientRect();
      ctx.clearRect(0,0,rect.width,rect.height);
      ctx.fillStyle='#9ed36a';ctx.fillRect(0,0,rect.width,rect.height);
      drawGoal();
      laneRows.forEach(drawLane);

      ctx.fillStyle='#8bc95a';
      [1,2,6,10,11].forEach(r=>ctx.fillRect(0,r*cellH,rect.width,cellH));

      hazards.forEach(h=>drawBurger(h.x,h.row,h.type));
      drawFrog();

      if(!running){
        ctx.fillStyle='rgba(53,30,17,.72)';ctx.fillRect(0,0,rect.width,rect.height);
        ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.font='900 42px system-ui';ctx.fillText('GAME OVER',rect.width/2,rect.height/2-20);
        ctx.font='700 18px system-ui';ctx.fillText('Tap Restart to try again',rect.width/2,rect.height/2+28);
      }
    }

    function loop(ts){
      const dt=Math.min((ts-lastTime)/1000,0.04)||0; lastTime=ts;
      update(dt);draw();requestAnimationFrame(loop);
    }

    function handleKey(e){
      const k=e.key.toLowerCase();
      if(['arrowup','w'].includes(k)){e.preventDefault();move(0,-1)}
      if(['arrowdown','s'].includes(k)){e.preventDefault();move(0,1)}
      if(['arrowleft','a'].includes(k)){e.preventDefault();move(-1,0)}
      if(['arrowright','d'].includes(k)){e.preventDefault();move(1,0)}
    }

    document.addEventListener('keydown',handleKey);
    document.querySelectorAll('.ctrl').forEach(btn=>{
      btn.addEventListener('pointerdown',e=>{
        e.preventDefault();
        const d=btn.dataset.dir;
        if(d==='up')move(0,-1);
        if(d==='down')move(0,1);
        if(d==='left')move(-1,0);
        if(d==='right')move(1,0);
      });
    });
    document.getElementById('restart').addEventListener('click',restart);
    window.addEventListener('resize',resize);

    resize();
    makeHazards();
    updateHud();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
