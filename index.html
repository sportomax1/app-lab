<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <title>Neon Invaders 🐙</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020617;color:#e2e8f0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:16px}.wrap{width:min(960px,100%)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.title{font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(1.2rem,3vw,2rem)}.hud{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;border:1px solid #334155;border-radius:999px;background:#0f172a;font-weight:800}.game-shell{position:relative;border:1px solid #1e293b;border-radius:20px;overflow:hidden;background:#020617;box-shadow:0 20px 60px rgba(0,0,0,.45)}canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:radial-gradient(circle at 50% 10%,#0f172a 0,#020617 55%,#000 100%)}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,6,23,.72);backdrop-filter:blur(4px);padding:24px;text-align:center}.overlay.hidden{display:none}.card{max-width:520px}.card h1{margin:0 0 10px;font-size:clamp(2rem,7vw,4rem);line-height:.95;color:#67e8f9;text-shadow:0 0 24px rgba(103,232,249,.45)}.card p{color:#cbd5e1;line-height:1.5}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;background:#22d3ee;color:#082f49;cursor:pointer;margin-top:10px}.controls{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin-top:14px}.controls button{height:54px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;border-radius:12px;font-size:1.35rem;font-weight:900;touch-action:manipulation}.controls .shoot{grid-column:1/4;background:#172554;color:#bfdbfe}.hint{text-align:center;color:#64748b;font-size:.86rem;margin-top:10px}.branch-animal{font-size:4rem;text-align:center;margin:6px 0 10px}@media(min-width:700px){.controls{display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="branch-animal">🐙</div>
    <div class="top">
      <div class="title">🐙 SANDBOX • 👾 Neon Invaders</div>
      <div class="hud">
        <div class="pill">Score: <span id="score">0</span></div>
        <div class="pill">Lives: <span id="lives">3</span></div>
        <div class="pill">Wave: <span id="wave">1</span></div>
      </div>
    </div>

    <div class="game-shell">
      <canvas id="game" width="800" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <h1>NEON INVADERS 🐙</h1>
          <p>Move left and right, blast the alien formation, survive incoming fire, and clear increasingly fast waves.</p>
          <p><strong>Desktop:</strong> ← → or A/D to move, Space to shoot.</p>
          <button class="btn" id="startBtn">START GAME</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button data-key="left">◀</button><button disabled>🚀</button><button data-key="right">▶</button>
      <button class="shoot" data-key="shoot">FIRE</button>
    </div>
    <div class="hint">🐙 Sandbox branch only • Space Invaders-style test build</div>
  </div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),waveEl=document.getElementById('wave'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');
const W=canvas.width,H=canvas.height;
let keys={},player,bullets,enemies,enemyBullets,stars,score,lives,wave,running,lastShot,enemyDir,enemySpeed,dropTimer;
function reset(){score=0;lives=3;wave=1;running=true;lastShot=0;enemyDir=1;enemySpeed=28;dropTimer=0;player={x:W/2-28,y:H-70,w:56,h:28,speed:320};bullets=[];enemyBullets=[];stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,a:Math.random()*.8+.2}));spawnWave();syncHud();overlay.classList.add('hidden');requestAnimationFrame(loop)}
function spawnWave(){enemies=[];const rows=Math.min(5,3+Math.floor((wave-1)/2)),cols=9,gapX=58,gapY=44,startX=(W-(cols-1)*gapX)/2-18;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)enemies.push({x:startX+c*gapX,y:70+r*gapY,w:36,h:26,row:r,alive:true});enemySpeed=28+wave*7;enemyDir=1}
function syncHud(){scoreEl.textContent=score;livesEl.textContent=lives;waveEl.textContent=wave}
function shoot(){const now=performance.now();if(now-lastShot<260||!running)return;lastShot=now;bullets.push({x:player.x+player.w/2-2,y:player.y-10,w:4,h:14,speed:520})}
function enemyShoot(){const alive=enemies.filter(e=>e.alive);if(!alive.length)return;const e=alive[Math.floor(Math.random()*alive.length)];enemyBullets.push({x:e.x+e.w/2-2,y:e.y+e.h,w:4,h:12,speed:210+wave*12})}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function loseLife(){lives--;syncHud();enemyBullets=[];player.x=W/2-player.w/2;if(lives<=0)endGame('GAME OVER')}
function endGame(text){running=false;overlay.classList.remove('hidden');overlay.querySelector('h1').textContent=text;overlay.querySelector('p').innerHTML=`Final score: <strong>${score}</strong> • Wave ${wave}`;startBtn.textContent='PLAY AGAIN'}
function update(dt){if(keys.left||keys.ArrowLeft||keys.a)player.x-=player.speed*dt;if(keys.right||keys.ArrowRight||keys.d)player.x+=player.speed*dt;player.x=Math.max(12,Math.min(W-player.w-12,player.x));if(keys.shoot||keys[' '])shoot();bullets.forEach(b=>b.y-=b.speed*dt);enemyBullets.forEach(b=>b.y+=b.speed*dt);bullets=bullets.filter(b=>b.y+b.h>0);enemyBullets=enemyBullets.filter(b=>b.y<H+20);let edge=false;for(const e of enemies)if(e.alive){e.x+=enemyDir*enemySpeed*dt;if(e.x<12||e.x+e.w>W-12)edge=true}if(edge){enemyDir*=-1;for(const e of enemies)if(e.alive){e.y+=16;e.x+=enemyDir*enemySpeed*dt*2}}dropTimer+=dt;if(dropTimer>Math.max(.35,1.15-wave*.05)){dropTimer=0;enemyShoot()}for(const b of bullets)for(const e of enemies)if(e.alive&&hit(b,e)){e.alive=false;b.y=-100;score+=10+e.row*5;syncHud();break}for(const b of enemyBullets)if(hit(b,player)){b.y=H+100;loseLife();break}if(enemies.some(e=>e.alive&&e.y+e.h>=player.y))endGame('INVASION COMPLETE');if(enemies.length&&enemies.every(e=>!e.alive)){wave++;syncHud();spawnWave();enemyBullets=[]}}
function drawShip(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#22d3ee';ctx.shadowColor='#22d3ee';ctx.shadowBlur=18;ctx.fillRect(10,12,36,13);ctx.fillRect(22,2,12,10);ctx.fillRect(2,20,52,7);ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);const hue=e.row%2?'#a78bfa':'#f472b6';ctx.fillStyle=hue;ctx.shadowColor=hue;ctx.shadowBlur=14;ctx.fillRect(7,4,22,5);ctx.fillRect(3,9,30,9);ctx.fillRect(0,14,6,8);ctx.fillRect(30,14,6,8);ctx.fillRect(8,18,6,7);ctx.fillRect(22,18,6,7);ctx.fillStyle='#020617';ctx.fillRect(9,11,4,4);ctx.fillRect(23,11,4,4);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;drawShip();for(const e of enemies)if(e.alive)drawEnemy(e);ctx.fillStyle='#67e8f9';ctx.shadowColor='#67e8f9';ctx.shadowBlur=10;for(const b of bullets)ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#fb7185';ctx.shadowColor='#fb7185';for(const b of enemyBullets)ctx.fillRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0}
let last=0;function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;if(k==='shoot')shoot()};const off=e=>{e.preventDefault();keys[k]=false};btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off)});startBtn.addEventListener('click',reset);draw();
</script>
<!-- netlify branch deploy trigger 2026-08-27 -->
</body>
</html>
